name: Windows build and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default: builds of pull requests cannot change the repository or releases.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      # Actions are pinned to exact commits so a moved tag cannot swap in different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Qt 6.8.3 and its MinGW 13.1.0 toolchain
        shell: pwsh
        run: |
          $kit = Join-Path $env:RUNNER_TEMP 'Qt'
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 6.8.3 win64_mingw -O $kit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 -O $kit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WBC_QT_KIT=$kit" >> $env:GITHUB_ENV

      - name: Prepare Inno Setup 6.7.4
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'InnoCompiler'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $exe
          if ((Get-FileHash -LiteralPath $exe).Hash -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') {
            throw 'Inno Setup checksum mismatch.'
          }
          $process = Start-Process -FilePath $exe -ArgumentList '/PORTABLE=1', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="{0}"' -f $destination) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Inno Setup exited $($process.ExitCode)." }
          "WBC_ISCC=$destination\ISCC.exe" >> $env:GITHUB_ENV

      - name: Build, run tests and package Windows x64
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected a vX.Y.Z release tag.' }
            $env:GITHUB_REF_NAME.Substring(1)
          }
          $params = @{
            QtDir = "$env:WBC_QT_KIT\6.8.3\mingw_64"
            MingwDir = "$env:WBC_QT_KIT\Tools\mingw1310_64"
            InnoCompiler = $env:WBC_ISCC
            OutputDir = "$env:RUNNER_TEMP\wbc-release"
            Version = $version
            RunTests = $true
          }
          ./installer/build-installer.ps1 @params

      - name: Test packaged installer, IPC and portable startup
        shell: pwsh
        env:
          QT_QUICK_BACKEND: software
        run: python tests/windows_package_test.py "$env:RUNNER_TEMP/wbc-release" "$env:RUNNER_TEMP/wbc-package-qa"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WirelessBatteryCenter-windows-x64
          path: ${{ runner.temp }}/wbc-release/*
          if-no-files-found: error

  # A maintainer publishes the draft after checking the artifacts.
  draft-release:
    needs: windows
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: WirelessBatteryCenter-windows-x64
          path: dist/release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Wireless Battery Center ${{ github.ref_name }}
          draft: true
          prerelease: true
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/release/WirelessBatteryCenter-*-windows-x64-setup.exe
            dist/release/WirelessBatteryCenter-*-windows-x64-portable.zip
            dist/release/headsetcontrol-4.3.0.tar.gz
            dist/release/SHA256SUMS.txt
