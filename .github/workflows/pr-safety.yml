name: PR safety check

# Flags things this app should never contain (network access, launching programs, keylogging,
# startup entries, binaries, build/release pipeline changes) so the reviewer knows which lines to
# read carefully. Results appear in the check's summary.
#
# Security: pull_request_target runs the scanner from the main branch, so a pull request cannot
# switch it off by editing it. The PR's code is only downloaded as a text diff; it is never
# checked out, built or run here.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, main branch only
      - name: Download the pull request's changes as text
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: gh api -H "Accept: application/vnd.github.diff" "repos/$GITHUB_REPOSITORY/compare/$PR_BASE...$PR_HEAD" > "$RUNNER_TEMP/pr.diff"
      - name: Scan for red flags
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          result=0
          bash scripts/pr-safety.sh "$RUNNER_TEMP/pr.diff" || result=$?
          if [ "$result" -eq 0 ]; then exit 0; fi
          if [ "$result" -ne 42 ]; then exit "$result"; fi

          # A registry write, API call, or build change needs review. Keep the findings
          # visible and accept an explicit review only from the owner on this exact head.
          context="wbc/pr-safety-review/$PR_BASE"
          reviewed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD/statuses?per_page=100" |
            jq -r --arg owner "$GITHUB_REPOSITORY_OWNER" --arg context "$context" '[.[] | select(.context == $context and .creator.login == $owner)][0].state // ""')
          if [ "$reviewed" != "success" ]; then
            echo "::error::Review the reported findings and record $context on $PR_HEAD as the repository owner."
            exit 1
          fi
          echo "Repository owner reviewed the reported findings for $PR_HEAD against $PR_BASE." >> "$GITHUB_STEP_SUMMARY"
      # AI tools add "Co-authored-by: Claude ..." to commit messages, which lists the AI as a repo
      # contributor once merged. Ask for those lines to be removed before merging.
      - name: Check commit messages for AI co-author credits
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate \
            --jq '.[] | .sha[0:7] + " " + (.commit.message | split("\n") | map(select(test("co-authored-by:.*(claude|anthropic|copilot|openai|chatgpt|cursor|codex|gemini)"; "i"))) | join(" | "))' \
            | grep -v '^[0-9a-f]* $' > "$RUNNER_TEMP/ai-credits.txt" || true
          if [ -s "$RUNNER_TEMP/ai-credits.txt" ]; then
            {
              echo "## AI co-author credits found"
              echo
              echo "These commits credit an AI tool as co-author, which would list it as a contributor."
              echo "Please remove the \`Co-authored-by\` line (\`git commit --amend\` or an interactive rebase) and force-push."
              echo
              sed 's/^/- /' "$RUNNER_TEMP/ai-credits.txt"
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/ai-credits.txt"
            exit 1
          fi
